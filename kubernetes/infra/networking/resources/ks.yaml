---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: issuers
spec:
  targetNamespace: networking

  path: ./kubernetes/infra/networking/resources/issuers

  dependsOn:
    - name: cert-manager

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: certificates
spec:
  targetNamespace: &namespace networking

  path: ./kubernetes/infra/networking/resources/certificates

  dependsOn:
    - name: cert-manager
    - name: issuers

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: gateways
spec:
  targetNamespace: networking

  path: ./kubernetes/infra/networking/resources/gateways

  dependsOn:
    - name: certificates
