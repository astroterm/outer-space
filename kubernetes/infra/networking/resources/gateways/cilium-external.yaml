apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-external
  namespace: networking
spec:
  addresses:
  - type: IPAddress
    value: 10.128.96.0
  gatewayClassName: cilium
  listeners:
  - name: outer-space
    hostname: "*.outer-space.io"
    port: 443
    protocol: HTTPS
    allowedRoutes:
      namespaces:
        from: All
    tls:
      certificateRefs:
        - name: outer-space-cert
