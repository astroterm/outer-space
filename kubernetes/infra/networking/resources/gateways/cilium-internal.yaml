apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: cilium-internal
  namespace: networking
spec:
  addresses:
    - type: IPAddress
      value: 192.168.2.128
  gatewayClassName: cilium
  listeners:
    - name: astrolab
      hostname: "*.astrolab.systems"
      port: 443
      protocol: HTTPS
      allowedRoutes:
        namespaces:
          from: All
      tls:
        certificateRefs:
          - name: astrolab-cert
