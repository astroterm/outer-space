---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudflare-ddns
spec:
  targetNamespace: &namespace networking

  path: ./kubernetes/infra/networking/cloudflare-ddns/app

  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: *app
    namespace: *namespace