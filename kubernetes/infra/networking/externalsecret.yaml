apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: cloudflare-secret
  namespace: networking
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler

  target:
    name: cloudflare-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        DOMAINS: "{{ .DOMAINS }}"
        CLOUDFLARE_API_TOKEN: "{{ .ZONE_API_TOKEN }}"

  dataFrom:
    - find:
        name:
          regexp: "^cloudflare/"
      rewrite:
        - regexp:
          source: "^cloudflare/"
          target: ""
