---
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: tailscale-operator
spec:
  interval: 1h
  chartRef:
    kind: OCIRepository
    name: tailscale
    namespace: flux-system
  valuesFrom:
  - kind: ConfigMap
    name: tailscale-values

  - targetPath: oauth.clientId
    kind: Secret
    name: tailscale-auth
    valuesKey: clientId

  - targetPath: oauth.clientSecret
    kind: Secret
    name: tailscale-auth
    valuesKey: clientSecret