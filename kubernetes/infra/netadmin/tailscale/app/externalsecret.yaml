apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler

  target:
    name: tailscale-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        clientId: "{{ .CLIENT_ID }}"
        clientSecret: "{{ .CLIENT_SECRET }}"

  dataFrom:
  - find:
      name:
        regexp: "^tailscale/.*"
    rewrite:
    - regexp:
        source: "^tailscale/(.*)"
        target: "$1"