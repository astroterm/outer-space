apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: tailscale-auth
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler

  target:
    name: tailscale-auth
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        client_id: "{{ .CLIENT_ID }}"
        client_secret: "{{ .CLIENT_SECRET }}"

  dataFrom:
    - find:
        name:
          regexp: "^tailscale/.*"
      rewrite:
        - regexp:
            source: "^tailscale/(.*)"
            target: "$1"