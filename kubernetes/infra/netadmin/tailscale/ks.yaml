---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale
  namespace: flux-system
spec:
  targetNamespace: &namespace netadmin

  path: ./kubernetes/infra/netadmin/tailscale/app

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: tailscale-operator
      namespace: *namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-resources
  namespace: flux-system
spec:
  targetNamespace: &namespace netadmin

  path: ./kubernetes/infra/netadmin/tailscale/resources

  dependsOn:
    - name: tailscale
    - name: es-operator
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app tailscale-auth
  namespace: flux-system
spec:
  targetNamespace: &namespace netadmin

  path: ./kubernetes/infra/netadmin/tailscale/secrets

  dependsOn:
    - name: es-operator