---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app external-secrets
spec:
  targetNamespace: &namespace external-secrets

  path: ./kubernetes/infra/external-secrets/external-secrets/app

  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: *app
    namespace: *namespace

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app secret-store
spec:
  targetNamespace: &namespace external-secrets

  path: ./kubernetes/infra/external-secrets/external-secrets/store

  dependsOn:
  - name: external-secrets
