---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app es-operator
spec:
  targetNamespace: &namespace external-secrets

  path: ./kubernetes/infra/external-secrets/es-operator/app

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace

---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app es-operator
spec:
  targetNamespace: &namespace external-secrets

  path: ./kubernetes/infra/external-secrets/es-operator/secretstore.yaml

  dependsOn:
  - name: es-operator
