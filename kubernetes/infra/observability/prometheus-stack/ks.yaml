---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app prometheus-stack
spec:
  targetNamespace: &namespace observability

  path: ./kubernetes/infra/observability/prometheus-stack/app

  dependsOn:
  - name: prometheus-crd
    namespace: *namespace

  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: *app
    namespace: *namespace