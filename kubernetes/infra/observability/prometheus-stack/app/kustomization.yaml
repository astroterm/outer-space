---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
  - httproute.yaml
components:
  - ../../../../components/helm-release
configMapGenerator:
  - name: prometheus-values
    files:
      - values.yaml=values.yaml
generatorOptions:
  disableNameSuffixHash: true