---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - helmrelease.yaml
components:
  - ../../../../components/helm-release
configMapGenerator:
- name: alloy-values
  files:
    - values.yaml=values.yaml
- name: alloy-config
  files:
    - config.alloy
generatorOptions:
  disableNameSuffixHash: true