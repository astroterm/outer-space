---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cloudnative-pg
spec:
  targetNamespace: &namespace cnpg-system

  path: ./kubernetes/infra/cnpg-system/cloudnative-pg/app

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app cnpg-cluster
spec:
  targetNamespace: &namespace cnpg-system

  path: ./kubernetes/infra/cnpg-system/cloudnative-pg/cluster
  
  dependsOn:
    - name: cloudnative-pg
