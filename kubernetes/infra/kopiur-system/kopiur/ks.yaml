---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur
spec:
  targetNamespace: &namespace kopiur-system

  path: ./kubernetes/infra/kopiur-system/kopiur/app

  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur-repo
spec:
  targetNamespace: &namespace kopiur-system

  path: ./kubernetes/infra/kopiur-system/kopiur/repo

  dependsOn:
    - name: kopiur
    - name: es-operator