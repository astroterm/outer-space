---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur
  namespace: flux-system
spec:
  targetNamespace: &namespace kopiur-system

  interval: 1h
  retryInterval: 5m
  timeout: 10m
  prune: true

  path: ./kubernetes/infra/kopiur-system/kopiur/app

  sourceRef:
    kind: GitRepository
    name: outer-space

  commonMetadata:
    labels:
      app.kubernetes.io/name: *app
  healthChecks:
    - apiVersion: helm.toolkit.fluxcd.io/v2
      kind: HelmRelease
      name: *app
      namespace: *namespace
---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app kopiur-repo
  namespace: flux-system
spec:
  targetNamespace: &namespace kopiur-system

  interval: 1h
  retryInterval: 5m
  timeout: 10m
  prune: true

  path: ./kubernetes/infra/kopiur-system/kopiur/repo

  sourceRef:
    kind: GitRepository
    name: outer-space

  dependsOn:
    - name: kopiur