apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: flux-operator-web
  namespace: flux-system
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: flux-operator
      app.kubernetes.io/instance: flux-operator

  ingress:
  - fromEntities:
    - ingress
    toPorts:
    - ports:
      - port: "9080"
        protocol: TCP