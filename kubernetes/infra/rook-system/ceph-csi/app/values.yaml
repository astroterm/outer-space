operatorConfig:
  namespace: rook-system
  driverSpecDefaults:
    imageSet:
      name: rook-csi-operator-image-set-configmap
    nodePlugin:
      priorityClassName: system-node-critical
    controllerPlugin:
      priorityClassName: system-cluster-critical
drivers:
  rbd:
    enabled: true
    name: rook-system.rbd.csi.ceph.com
  cephfs:
    enabled: true
    name: rook-system.cephfs.csi.ceph.com
  nfs:
    enabled: false
    name: rook-system.nfs.csi.ceph.com
  nvmeof:
    enabled: false
    name: rook-system.nvmeof.csi.ceph.com
