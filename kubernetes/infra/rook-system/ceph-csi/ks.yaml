---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app ceph-csi
spec:
  targetNamespace: &namespace rook-system

  path: ./kubernetes/infra/rook-system/ceph-csi/app
  
  dependsOn:
  - name: rook-ceph

  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: *app
    namespace: *namespace