---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app rook-cluster
spec:
  targetNamespace: &namespace rook-system

  path: ./kubernetes/infra/rook-system/rook-cluster/app

  dependsOn:
  - name: rook-ceph
  - name: ceph-csi

  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: *app
    namespace: *namespace