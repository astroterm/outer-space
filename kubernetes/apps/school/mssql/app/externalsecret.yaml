apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mssql-secret
spec:
  secretStoreRef:
    kind: ClusterSecretStore
    name: doppler

  target:
    name: mssql-secret
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        MSSQL_SA_PASSWORD: "{{ .password }}"

  dataFrom:
    - extract:
        key: mssql
