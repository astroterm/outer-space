---
apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: &app mssql
  namespace: flux-system
spec:
  targetNamespace: &namespace school

  path: ./kubernetes/apps/school/mssql/app

  healthChecks:
  - apiVersion: helm.toolkit.fluxcd.io/v2
    kind: HelmRelease
    name: mssql
    namespace: *namespace